server.port=8080

# ==========================================================
# H2 Database Configuration - AMBIENTE DE PRUEBAS
# ==========================================================

spring.datasource.url=jdbc:h2:mem:playlistdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================================
# H2 Console - SOLO PARA PRUEBAS
# ==========================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================================
# JPA / Hibernate - AMBIENTE DE PRUEBAS
# ==========================================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# CONFIGURACIÓN PARA PRODUCCIÓN
# ==========================================================
# En producción, utilizar variables de entorno para evitar
# almacenar credenciales directamente en el código.
#
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
#
# No utilizar create-drop en producción.
# spring.jpa.hibernate.ddl-auto=validate
#
# La consola H2 debe permanecer deshabilitada en producción.
# spring.h2.console.enabled=false
#
# No mostrar las consultas SQL en producción.
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=false

# ==========================================================
# Springdoc OpenAPI / Swagger UI
# ==========================================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
